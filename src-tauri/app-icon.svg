<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: the existing Nexus star (src/components/NexusMark) on the
       design tokens' ink colours. Replace this file to change the icon; the
       Windows icons are generated from it. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19254a" />
      <stop offset="1" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="star" x1="5" y1="3" x2="19" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef5ff" />
      <stop offset="1" stop-color="#7fb0ff" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#ink)" />
  <g transform="translate(512 512) scale(30) translate(-12 -12)">
    <path d="M12 1.5c.55 5.9 4.6 9.95 10.5 10.5-5.9.55-9.95 4.6-10.5 10.5-.55-5.9-4.6-9.95-10.5-10.5C7.4 11.45 11.45 7.4 12 1.5Z" fill="url(#star)" />
  </g>
</svg>
